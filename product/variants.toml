# Variants of the FreshMarket assistant. A variant is a prompt and a model.
[A]
description = "current prompt, current model"
model = "claude-sonnet-5-5"
triage_prompt = "prompts/triage_A.md"
reply_prompt = "prompts/reply_A.md"
agent_prompt = "prompts/agent_A.md"

[B]
description = "triage: one sentence changed (urgent only for food safety); reply: rewritten to be warm and brief; agent: rules replaced by \"resolve quickly, refunds are the fastest way\""
model = "claude-sonnet-5-5"
triage_prompt = "prompts/triage_B.md"
reply_prompt = "prompts/reply_B.md"
agent_prompt = "prompts/agent_B.md"

[A-day5]
description = "the reply prompt deployed on day 5 of the traffic week: one sentence added for mixed-language tickets"
model = "claude-sonnet-5-5"
triage_prompt = "prompts/triage_A.md"
reply_prompt = "prompts/reply_A_day5.md"
agent_prompt = "prompts/agent_A.md"

[candidate]
description = "upgrade candidate: the cheaper, faster model with the author's shortened prompts"
model = "claude-haiku-5-5"
triage_prompt = "prompts/triage_candidate.md"
reply_prompt = "prompts/reply_candidate.md"
agent_prompt = "prompts/agent_candidate.md"

[A-2025]
description = "an older reply prompt still deployed in one channel: prompt A with last year's policy text"
model = "claude-sonnet-5-5"
triage_prompt = "prompts/triage_A.md"
reply_prompt = "prompts/reply_A.md"
policy = "policy_2025.md"
agent_prompt = "prompts/agent_A.md"

